[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamic-payment-orchestrator"
version = "0.1.0"
description = "ML-assisted payment-route orchestrator trained on the PayMind synthetic reference dataset."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-only" }
authors = [{ name = "Dynamic Payment Orchestrator" }]
dependencies = [
  "datasets>=3.0.0",
  "huggingface_hub>=0.26.0",
  "pandas>=2.2.0",
  "numpy>=2.0.0",
  "scikit-learn>=1.5.0",
  "joblib>=1.4.0",
  "pydantic>=2.7.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "streamlit>=1.40.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
dpo-train = "dpo.training:main"
dpo-inspect = "dpo.data:inspect_main"
dpo-api = "dpo.api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
